<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>kanban board</title>
</head>

<body>
    <main>
        <nav>
            <div class="left">kanban</div>
            <div class="right">
                <button id="toggle-modal" class="add-btn">
                    Add Task
                </button>
            </div>
        </nav>

        <section class="board">
            <div id="todo" class="task-column">
                <div class="heading">
                    <div class="left">To Do</div>
                    <div class="right">count</div>
                </div>
                </div>
            </div>
            <div id="progress" class="task-column">
                <div class="heading">
                    <div class="left">In Progress</div>
                    <div class="right">count</div>
                </div>
            </div>
            <div id="done" class="task-column">
                <div class="heading">
                    <div class="left">Done</div>
                    <div class="right">count</div>
                </div>

            </div>
            </div>


        </section>

    </main>
    
    <div class="modal  add-new-task">
        
        <div class="bg">
        </div>
            <div class="center">
                <input type="text" placeholder="Task Title" id="task-title-input">
                <textarea placeholder="description" id="task-desc-input"></textarea>
                <button id="add-new-task" class="add-btn">Add Task</button>

        </div>

    </div>


    <script src="script.js"></script>
</body>

</html>
